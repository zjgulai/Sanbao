# 只有 insert 能造出行：composeEntries 的基线是空 entry 列表，id 补丁不新建行。
# 这两行让「bundle 启用 web-startup」与「壳 overlay 关掉它」成为同一行上的可观测竞争。
- insert:
    - id: web-startup
      name: 'lute-fixture-web-startup'

    - id: fixture-bundle-row
      name: 'lute-fixture-bundle-row'

- id: web-startup
  disabled: false

- id: fixture-bundle-row
  config:
    fromBundle: true
