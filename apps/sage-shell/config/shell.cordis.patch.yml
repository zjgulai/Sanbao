# The shell uses in-app directory browsing until its native picker bridge exists.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: shell-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: shell-ui-directory-picker
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
