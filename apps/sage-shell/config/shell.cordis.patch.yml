# The shell uses in-app directory browsing until its native picker bridge exists.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

# Sage 隐私默认（ADR-0193）：官方 DeepSeek API 的会话日志贡献在 0.2.0 起默认开启
# （`dsh-session-log-deepseek` 配置 `enabled` 默认 true），Sage 组合显式关闭；
# 需要时由实例在本地 patch 层按用途重新开启。
- id: session-log-deepseek
  config:
    enabled: false

- insert:
    - id: shell-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: shell-ui-directory-picker
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
