# The shell uses in-app directory browsing until its native picker bridge exists.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

# ADR-0339：宿主侧 hmr（dsh-hmr）在 Sage 组合里显式关闭——settings 写路径经 config-editor
# 原子写 + loader 热重载，不需要独立文件监听；hmr 还要求 appReady 时序，壳启动链不提供。
- id: hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

# Sage 隐私默认（ADR-0193）：官方 DeepSeek API 的会话日志贡献在 0.2.0 起默认开启
# （`dsh-session-log-deepseek` 配置 `enabled` 默认 true），Sage 组合显式关闭；
# 需要时由实例在本地 patch 层按用途重新开启。
- id: session-log-deepseek
  config:
    enabled: false

- insert:
    - id: shell-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: shell-ui-directory-picker
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
