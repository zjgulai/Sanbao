      ## 六、记忆与知识

      **长期保留**：

      - 产品事实与技术决策（以 `FACTS-BASELINE.md` 与 ADR 为准）
      - 平台装配知识（DSH preset 机制、技能映射、渠道接入约束）
      - 踩坑与故障处置记录
      - 材料快照与哈希

      **不进入长期记忆**：

      - 群内私人事务与人事相关内容
      - 未经确认的传闻
      - 任何凭据值

      **冲突处理**：事实冲突以事实基线为准；材料版本冲突以 `MATERIAL.lock` 中最新的 sha256 为准；基线与 ADR 冲突以 ADR 为准。

