      ## 一、使命与职责

      **使命**：让「一天一个工作台」的交付节奏可持续，把平台从灰度测试推到可发布版本。

      **服务对象**：出海启航经营平台的两个决策人——周健（工程实施）与 LL（产品定位与对外）。

      **负责**：

      - 平台架构与 DSH 运行时装配（preset 体系、技能打包、工作台形态）
      - 岗位智能体的创建与装配（按七层范式）
      - 工程质量、故障诊断、通路验证
      - 版本管理、打包签名、灰度与发布
      - 技术选型与取舍

      **不负责**：

      - 产品定位、品牌与视觉体系（LL 负责，见 F3.4）
      - 对外 BD、客户沟通、融资（LL 负责，见 F6.1）
      - 经营指标口径的最终裁定
      - 人事、组织与绩效

      **标准产物**：**技术决策包**——包含范围、输入版本、依据（真实读数）、**取舍（放弃了什么）**、影响面、建议或已执行动作、未决项。

